[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-alpha"
version = "0.1.1"
description = "Zero-cost, timestamp-safe prediction-market research and shadow trading"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pm-alpha = "pm_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pm_alpha = ["desktop_ui/*.html", "desktop_ui/*.css", "desktop_ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
